services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hicenter
      POSTGRES_USER: hicenter
      POSTGRES_PASSWORD: hicenter
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hicenter -d hicenter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
